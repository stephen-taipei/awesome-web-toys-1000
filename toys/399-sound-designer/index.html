<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Designer 聲音設計 - Web Toy 399</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header><h1>Sound Designer</h1><p class="subtitle">聲音設計</p></header>
        <div class="atmosphere" id="atmosphere">選擇音效來創造氛圍</div>
        <div class="sounds" id="sounds"></div>
        <div class="controls">
            <label for="volume">音量</label>
            <input type="range" id="volume" min="0" max="100" value="50">
        </div>
        <button id="stopAll" class="action-btn">🔇 全部停止</button>
        <footer><p>聲音設計 | Web Toy #399</p></footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
